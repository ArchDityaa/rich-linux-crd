name: RICH LINUX (macOS + noVNC + Cloudflare Quick Tunnel)

on:
  workflow_dispatch:
    inputs:
      vnc_password:
        description: "VNC password (min 6 karakter, sama untuk user runner)"
        required: true
        type: string
      keep_alive_minutes:
        description: "Durasi runner tetap hidup setelah setup (menit, maks 360)"
        required: false
        default: "360"
        type: string

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 360

    steps:

      - name: Checkout repository (for setup scripts)
        uses: actions/checkout@v4

      # ============================================================
      # SETUP MACOS USER
      # ============================================================
      - name: Setup User
        run: |
          C_CYAN='\033[1;36m'; C_GREEN='\033[1;32m'; C_YELLOW='\033[1;33m'; C_RED='\033[1;31m'; C_NC='\033[0m'

          echo ""
          echo "------------------------------------------------------------"
          echo -e "${C_CYAN}[STEP 01/04] SETUP USER${C_NC}"
          echo "------------------------------------------------------------"

          echo -e "${C_YELLOW}[INFO] User aktif di runner ini:${C_NC}"
          id
          whoami

          echo -e "${C_GREEN}[OK] Sudo passwordless tersedia (runs-on macos-15).${C_NC}"

      # ============================================================
      # SETUP REMOTE ACCESS (VNC + noVNC + CLOUDFLARE QUICK TUNNEL)
      # ============================================================
      - name: Setup Remote Access
        env:
          VNC_PASSWORD: ${{ inputs.vnc_password }}
        run: |
          C_CYAN='\033[1;36m'; C_GREEN='\033[1;32m'; C_YELLOW='\033[1;33m'; C_RED='\033[1;31m'; C_NC='\033[0m'

          echo ""
          echo "------------------------------------------------------------"
          echo -e "${C_CYAN}[STEP 02/04] SETUP REMOTE ACCESS (VNC + noVNC + CLOUDFLARE)${C_NC}"
          echo "------------------------------------------------------------"

          if [ ! -f "$GITHUB_WORKSPACE/scripts/mac/setup-remote-access.sh" ]; then
            echo -e "${C_RED}[FAIL] scripts/mac/setup-remote-access.sh tidak ditemukan (checkout gagal).${C_NC}"
            exit 1
          fi

          chmod +x "$GITHUB_WORKSPACE/scripts/mac/setup-remote-access.sh"
          "$GITHUB_WORKSPACE/scripts/mac/setup-remote-access.sh"

      # ============================================================
      # HOLD BREW PACKAGES (PREVENT SURPRISE UPGRADES FROM DROPPING VNC)
      # ============================================================
      - name: Hold Brew Packages
        run: |
          C_CYAN='\033[1;36m'; C_GREEN='\033[1;32m'; C_YELLOW='\033[1;33m'; C_NC='\033[0m'

          echo ""
          echo "------------------------------------------------------------"
          echo -e "${C_CYAN}[STEP 03/04] HOLD BREW PACKAGES${C_NC}"
          echo "------------------------------------------------------------"

          # Jangan izinkan `brew upgrade` menaikkan paket yang bisa mengganggu
          # sesi remote (cloudflared/websockify/noVNC). Paket build tools lain
          # tetap boleh di-upgrade user.
          for p in cloudflared; do
            if brew list --versions "$p" >/dev/null 2>&1; then
              brew pin "$p" 2>/dev/null || true
              echo -e "${C_GREEN}[OK] brew pin: ${C_CYAN}$p${C_NC}"
            fi
          done

          echo -e "${C_GREEN}[OK] Hold selesai. Gunakan \`safe-upgrade\` setara untuk brew di macOS (belum ada helper khusus).${C_NC}"

      # ============================================================
      # VERIFY
      # ============================================================
      - name: Verify Installation
        run: |
          C_CYAN='\033[1;36m'; C_GREEN='\033[1;32m'; C_YELLOW='\033[1;33m'; C_RED='\033[1;31m'; C_NC='\033[0m'

          echo ""
          echo "------------------------------------------------------------"
          echo -e "${C_CYAN}[STEP 04/04] VERIFY INSTALLATION${C_NC}"
          echo "------------------------------------------------------------"

          echo "::group::[CHECK] System"
          sw_vers
          uname -a
          arch
          echo "::endgroup::"

          echo "::group::[CHECK] Screen Sharing (VNC port 5900)"
          if lsof -nP -iTCP:5900 -sTCP:LISTEN >/dev/null 2>&1; then
            echo -e "${C_GREEN}[OK] VNC aktif di port 5900.${C_NC}"
          else
            echo -e "${C_RED}[FAIL] Port 5900 tidak aktif!${C_NC}"
            exit 1
          fi
          echo "::endgroup::"

          echo "::group::[CHECK] noVNC (port 6080)"
          if curl -sf "http://127.0.0.1:6080/vnc.html" >/dev/null 2>&1; then
            echo -e "${C_GREEN}[OK] noVNC web UI aktif di port 6080.${C_NC}"
          else
            echo -e "${C_RED}[FAIL] noVNC tidak merespons!${C_NC}"
            exit 1
          fi
          echo "::endgroup::"

          echo "::group::[CHECK] Cloudflare Quick Tunnel"
          if [ -f /tmp/cf-tunnel-url.txt ]; then
            TUNNEL_URL=$(cat /tmp/cf-tunnel-url.txt)
            echo -e "${C_GREEN}[OK] Tunnel URL: ${C_CYAN}${TUNNEL_URL}/vnc.html${C_NC}"
            echo "::notice::macOS desktop siap! Buka ${TUNNEL_URL}/vnc.html di browser, masukkan VNC password."
          else
            echo -e "${C_RED}[FAIL] /tmp/cf-tunnel-url.txt tidak ditemukan!${C_NC}"
            tail -n 25 /tmp/cloudflared.log 2>/dev/null || true
            exit 1
          fi
          echo "::endgroup::"

          echo ""
          echo -e "${C_GREEN}[OK] Installation verification completed.${C_NC}"

      # ============================================================
      # DIAGNOSTIC (only runs on failure)
      # ============================================================
      - name: Diagnostic (on failure)
        if: failure()
        run: |
          C_CYAN='\033[1;36m'; C_GREEN='\033[1;32m'; C_YELLOW='\033[1;33m'; C_RED='\033[1;31m'; C_NC='\033[0m'

          echo ""
          echo "=============================================================="
          echo -e "${C_RED}  DIAGNOSTIC REPORT — FAILED STEP DETECTED${C_NC}"
          echo "=============================================================="

          echo ""
          echo -e "${C_CYAN}[1/10] SYSTEM VERSION${C_NC}"
          sw_vers 2>/dev/null || true
          uname -a
          arch

          echo ""
          echo -e "${C_CYAN}[2/10] DISK & MEMORY${C_NC}"
          df -h / 2>/dev/null | head -3
          sysctl hw.memsize 2>/dev/null || true
          sysctl hw.ncpu 2>/dev/null || true

          echo ""
          echo -e "${C_CYAN}[3/10] SCREENSHARINGD SERVICE STATUS${C_NC}"
          echo "  launchctl list (screensharing):"
          sudo launchctl list com.apple.screensharing 2>&1 || echo "    (not registered)"
          echo ""
          echo "  launchctl print system (screensharing excerpt):"
          sudo launchctl print system/com.apple.screensharing 2>&1 | head -20 || echo "    (print failed)"
          echo ""
          echo "  Proses screensharingd:"
          ps aux 2>/dev/null | grep -i screensharing | grep -v grep || echo "    (tidak jalan)"

          echo ""
          echo -e "${C_CYAN}[4/10] ALL LISTENING PORTS${C_NC}"
          sudo lsof -nP -iTCP -sTCP:LISTEN -P -n 2>/dev/null | head -40 || echo "    (tidak ada)"

          echo ""
          echo -e "${C_CYAN}[5/10] PORT 5900 SPESIFIK${C_NC}"
          sudo lsof -nP -iTCP:5900 2>/dev/null || echo "    (port 5900 tidak aktif)"
          echo "  netstat (port 5900):"
          netstat -an 2>/dev/null | grep 5900 || echo "    (tidak ada)"
          echo "  pfctl (firewall):"
          sudo pfctl -sr 2>/dev/null | head -5 || echo "    (pf tidak aktif)"

          echo ""
          echo -e "${C_CYAN}[6/10] KICKSTART / REMOTE MANAGEMENT${C_NC}"
          KICKSTART="/System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart"
          echo "  kickstart path: $KICKSTART"
          ls -la "$KICKSTART" 2>/dev/null || echo "    (tidak ditemukan)"
          sudo "$KICKSTART" -legacy 2>&1 | head -5 || true
          echo "  /Library/Preferences/com.apple.RemoteManagement.plist:"
          sudo defaults read /Library/Preferences/com.apple.RemoteManagement 2>&1 | head -15 || echo "    (tidak ada)"

          echo ""
          echo -e "${C_CYAN}[7/10] LAUNCHD PLISTS TERKAIT${C_NC}"
          echo "  System:"
          ls -la /System/Library/LaunchDaemons/com.apple.screensharing.plist 2>/dev/null || echo "    (tidak ada)"
          ls -la /System/Library/LaunchDaemons/com.apple.RemoteDesktop.plist 2>/dev/null || echo "    (tidak ada)"
          echo "  User overrides:"
          ls -la /Library/LaunchDaemons/com.apple.screensharing.plist 2>/dev/null || echo "    (tidak ada user override)"

          echo ""
          echo -e "${C_CYAN}[8/10] LOGIN WINDOW / SESSION${C_NC}"
          echo "  LoginWindow process:"
          ps aux 2>/dev/null | grep -i loginwindow | grep -v grep || echo "    (tidak ditemukan)"
          echo "  console user:"
          who 2>/dev/null || echo "    (tidak ada)"
          echo "  current user:"
          id

          echo ""
          echo -e "${C_CYAN}[9/10] AOSP / SYSTEM LOG (last screensharing-related)${C_NC}"
          log show --predicate 'process == "screensharingd" OR process == "ARDAgent" OR eventMessage contains "ScreenSharing"' --last 5m --style compact 2>/dev/null | tail -n 20 || echo "    (log show tidak tersedia)"

          echo ""
          echo -e "${C_CYAN}[10/10] FIREWALL / NETWORK${C_NC}"
          echo "  pfctl info:"
          sudo pfctl -si 2>/dev/null | head -5 || echo "    (pf tidak aktif)"
          echo "  networksetup:"
          sudo networksetup -listallnetworkservices 2>/dev/null | head -5 || true
          echo "  DNS:"
          cat /etc/resolv.conf 2>/dev/null || true
          echo "  IP addresses:"
          ifconfig 2>/dev/null | grep -A2 'inet ' | head -15 || ip addr 2>/dev/null | head -15

          echo ""
          echo "=============================================================="
          echo -e "${C_RED}  DIAGNOSTIC COMPLETE — kirim log ini untuk debugging.${C_NC}"
          echo "=============================================================="

      # ============================================================
      # KEEP ALIVE
      # ============================================================
      - name: Keep Alive
        run: |
          C_CYAN='\033[1;36m'; C_GREEN='\033[1;32m'; C_YELLOW='\033[1;33m'; C_NC='\033[0m'

          echo ""
          echo "=============================================================="
          echo -e "${C_GREEN}  [OK] MACOS REMOTE DESKTOP IS RUNNING${C_NC}"
          echo "=============================================================="
          TUNNEL_URL="$(cat /tmp/cf-tunnel-url.txt 2>/dev/null || true)"
          echo -e "  ${C_YELLOW}[INFO] Open : ${C_CYAN}${TUNNEL_URL:-<tunnel url>}/vnc.html${C_NC}"
          echo -e "  ${C_YELLOW}[INFO] User : runner${C_NC}"
          echo -e "  ${C_YELLOW}[INFO] Keep-alive: ${{ inputs.keep_alive_minutes }} menit. Jangan cancel workflow.${C_NC}"
          echo -e "  [INFO] Coba: open ${TUNNEL_URL:-<tunnel url>}/vnc.html"
          echo "=============================================================="

          SLEEP_SECS=$(( ${{ inputs.keep_alive_minutes }} * 60 ))
          sleep "$SLEEP_SECS"